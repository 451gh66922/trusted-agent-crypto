[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-auth"
version = "0.1.0"
description = "SE-backed trusted authorization for AI Agents (DPoP + policy gate)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]
gm = [
    "gmssl>=3.2.2",
]
se = [
    # Real SE / PKCS#11 bindings to be pinned when hardware path lands
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
